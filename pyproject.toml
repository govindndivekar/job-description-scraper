[project]
name = "jdscraper"
version = "0.1.0"
description = "Polite Bangalore career-page scraper for QA, SDET, and test-automation roles"
readme = "README.md"
authors = [
    { name = "govindndivekar", email = "govind_divekar@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
jdscraper = "jdscraper.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
